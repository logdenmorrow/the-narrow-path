name: Publish Today in the Church profiles

on:
  schedule:
    - cron: '17 11 * * 2'
  workflow_dispatch:
    inputs:
      start:
        description: First calendar date (YYYY-MM-DD); blank uses the run date
        required: false
        type: string
      days:
        description: Inclusive lookahead window
        required: false
        default: '70'
        type: string
      limit:
        description: Maximum profiles to draft
        required: false
        default: '3'
        type: string
      relations:
        description: Calendar entries to draft
        required: false
        default: all
        type: choice
        options:
          - all
          - primary
          - related

concurrency:
  group: draft-liturgical-profiles
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check publishing configuration
        id: key
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Today in the Church automated publication"
              echo
              echo "No articles were created because the OPENAI_API_KEY repository secret is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare persistent automation branch
        if: steps.key.outputs.configured == 'true'
        shell: bash
        run: |
          branch="automation/liturgical-profile-publishing"
          default_branch="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$default_branch"
          if git fetch origin "$branch"; then
            git checkout -B "$branch" "origin/$branch"
            git rebase "origin/$default_branch"
          else
            git checkout -b "$branch" "origin/$default_branch"
          fi

      - name: Set up Node.js
        if: steps.key.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.key.outputs.configured == 'true'
        run: npm ci

      - name: Research, draft, and gate profiles
        if: steps.key.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_LITURGICAL_PROFILE_MODEL || 'gpt-5.4-mini' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_LITURGICAL_REVIEW_MODEL || vars.OPENAI_LITURGICAL_PROFILE_MODEL || 'gpt-5.4-mini' }}
          LITURGICAL_REJECTION_REPORT: ${{ runner.temp }}/liturgical-article-rejections.json
          TODAY_DATE: ${{ inputs.start }}
          LOOKAHEAD_DAYS: ${{ inputs.days || '70' }}
          PROFILE_LIMIT: ${{ inputs.limit || '3' }}
          PROFILE_RELATIONS: ${{ inputs.relations || 'all' }}
        shell: bash
        run: |
          args=(--days "$LOOKAHEAD_DAYS" --limit "$PROFILE_LIMIT" --relations "$PROFILE_RELATIONS")
          if [[ -n "$TODAY_DATE" ]]; then
            args+=(--start "$TODAY_DATE")
          fi
          npm run draft:liturgical-profiles -- "${args[@]}"

      - name: Validate generated content
        if: steps.key.outputs.configured == 'true'
        run: |
          npm run check:liturgical-profile-registry
          npm run scan:liturgical-content

      - name: Detect approved article changes
        id: changes
        if: steps.key.outputs.configured == 'true'
        shell: bash
        run: |
          if git diff --quiet -- content/liturgical-profiles content/liturgical-calendar/profile-links.json content/liturgical-calendar/generated-profile-registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, merge, and deploy approved articles
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/liturgical-profile-publishing"
          default_branch="${{ github.event.repository.default_branch }}"
          git add content/liturgical-profiles content/liturgical-calendar/profile-links.json content/liturgical-calendar/generated-profile-registry.json
          git commit -m "content: publish upcoming liturgical profiles"
          git push --force-with-lease origin "HEAD:$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --head "$branch" \
              --base "$default_branch" \
              --title "content: publish approved Today in the Church profiles" \
              --body "Automatically researched Today in the Church articles. Every included profile passed deterministic structure, prose, source diversity, URL, and search-trace checks; a separate source-checking editorial review; the profile registry check; and the full liturgical content scanner. Failed candidates were excluded and reported in the workflow summary.")"
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" --merge --delete-branch
          gh workflow run publish-ghcr.yml --ref "$default_branch"

      - name: Record no-change result
        if: steps.key.outputs.configured == 'true' && steps.changes.outputs.changed != 'true'
        shell: bash
        run: |
          {
            echo
            echo "No new profile changes were needed in the configured lookahead window."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify owner about rejected articles
        id: rejection_notice
        if: always() && steps.key.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REJECTION_REPORT: ${{ runner.temp }}/liturgical-article-rejections.json
        shell: bash
        run: |
          count=0
          if [[ -f "$REJECTION_REPORT" ]]; then
            count="$(jq 'length' "$REJECTION_REPORT")"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" -eq 0 ]]; then
            exit 0
          fi

          gh label create "article-rejected" \
            --description "An automatically drafted Today in the Church article failed publication gates" \
            --color "B60205" \
            --force

          while IFS= read -r rejection; do
            date="$(jq -r '.date' <<< "$rejection")"
            title="$(jq -r '.title' <<< "$rejection")"
            issue_title="[Today in the Church] Rejected: $date — $title"
            body_file="$RUNNER_TEMP/liturgical-rejection-${date}.md"
            {
              printf '@logdenmorrow, the automated publisher rejected **%s** for **%s** after both drafting attempts. Nothing from this candidate was published.\n\n' "$title" "$date"
              printf 'Rejection reasons:\n\n'
              jq -r '.reasons[] | "- " + .' <<< "$rejection"
              printf '\n[Open the failed workflow run](%s)\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$body_file"

            issues="$(gh issue list --state all --limit 10 --search "\"$issue_title\" in:title" --json number,title,state)"
            match="$(jq -c --arg title "$issue_title" '.[] | select(.title == $title)' <<< "$issues" | head -n 1)"
            if [[ -n "$match" ]]; then
              issue_number="$(jq -r '.number' <<< "$match")"
              issue_state="$(jq -r '.state' <<< "$match")"
              if [[ "$issue_state" == "CLOSED" ]]; then
                gh issue reopen "$issue_number"
              fi
              gh issue comment "$issue_number" --body-file "$body_file"
            else
              gh issue create \
                --title "$issue_title" \
                --label "article-rejected" \
                --body-file "$body_file"
            fi
          done < <(jq -c '.[]' "$REJECTION_REPORT")

      - name: Notify owner about publisher failure
        if: failure() && steps.key.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_title="[Today in the Church] Automated publisher failed"
          body_file="$RUNNER_TEMP/liturgical-publisher-failure.md"
          {
            printf '@logdenmorrow, the Today in the Church publisher encountered an infrastructure or validation failure.\n\n'
            printf '[Open the failed workflow run](%s)\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$body_file"
          gh label create "automation-failure" \
            --description "A production content automation failed" \
            --color "D93F0B" \
            --force
          issues="$(gh issue list --state all --limit 10 --search "\"$issue_title\" in:title" --json number,title,state)"
          match="$(jq -c --arg title "$issue_title" '.[] | select(.title == $title)' <<< "$issues" | head -n 1)"
          if [[ -n "$match" ]]; then
            issue_number="$(jq -r '.number' <<< "$match")"
            issue_state="$(jq -r '.state' <<< "$match")"
            if [[ "$issue_state" == "CLOSED" ]]; then
              gh issue reopen "$issue_number"
            fi
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create \
              --title "$issue_title" \
              --label "automation-failure" \
              --body-file "$body_file"
          fi

      - name: Fail the run when articles are rejected
        if: always() && steps.rejection_notice.outputs.count != '' && steps.rejection_notice.outputs.count != '0'
        shell: bash
        run: |
          echo "One or more articles were rejected. GitHub issues contain the details."
          exit 1
