name: Refresh USCCB liturgical calendar facts

on:
  schedule:
    - cron: '41 10 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-usccb-liturgical-calendar
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import factual USCCB calendar metadata
        run: npm run import:liturgical-calendar

      - name: Validate liturgical content and active-season coverage
        run: npm run scan:liturgical-content

      - name: Detect factual changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- content/liturgical-calendar/us-gospel-season-facts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open factual update for review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/usccb-liturgical-calendar"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git add content/liturgical-calendar/us-gospel-season-facts.json
          git commit -m "content: refresh USCCB liturgical calendar facts"
          git push --force-with-lease origin "HEAD:$branch"
          if ! gh pr list --head "$branch" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr create \
              --head "$branch" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "content: refresh USCCB liturgical calendar facts" \
              --body "Automated factual metadata refresh from the official USCCB calendar PDFs. No editorial or AI-generated prose is included. Review is required before merge."
          fi

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## USCCB liturgical calendar refresh"
            echo
            echo "- Coverage: 2026-09-01 through 2027-02-09 (162 dates)"
            echo "- Factual changes detected: ${{ steps.changes.outputs.changed }}"
            echo "- Editorial prose generated: no"
          } >> "$GITHUB_STEP_SUMMARY"
