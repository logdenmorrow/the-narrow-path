name: Import Liturgy of the Hours content

on:
  schedule:
    # Daily at 09:17 UTC. A non-round minute reduces shared-runner congestion.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Re-import and replace existing hour/date rows
        required: false
        default: false
        type: boolean

concurrency:
  group: import-liturgy-of-the-hours
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Import Liturgy of the Hours content
        shell: bash
        run: |
          args=(--rolling --delay-ms 4000)
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          node scripts/import-night-prayer.mjs "${args[@]}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
